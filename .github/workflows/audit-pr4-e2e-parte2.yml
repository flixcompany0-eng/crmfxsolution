# Workflow temporário de investigação. Não altera os gates do PR #4.
name: Auditoria PR4 — unitários em checkouts originais
'on':
  push:
    branches:
    - codex/audit-pr4-e2e-parte2-20261006
permissions:
  contents: read
jobs:
  checks:
    name: checks originais (${{ matrix.variante }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variante:
        - base
        - jsdom-antigo
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2
        ref: ${{ matrix.variante == 'base' && 'c79f64e481f4d5db9c1922c639f751e4d5d635e2' || '3b26f30393570bbd022f60fc8680f6f477393260' }}
    - uses: ./.github/actions/preparar-node
      timeout-minutes: 5
    - name: Reter somente o grupo sob teste e conferir as demais dependências
      run: "set -euo pipefail\npnpm list --depth 0 --json > /tmp/deps-antes.json\nVARIANTE=\"${{ matrix.variante }}\" node <<'JS'\nconst fs = require('node:fs');\nconst { execFileSync } = require('node:child_process');\nconst p = JSON.parse(fs.readFileSync('package.json', 'utf8'));\nconst b = JSON.parse(execFileSync('git', ['show', 'c79f64e481f4d5db9c1922c639f751e4d5d635e2:package.json'], { encoding: 'utf8' }));\nconst grupos = {\n  'playwright-antigo': ['@playwright/test'],\n  'react-antigo': ['react', 'react-dom', '@types/react', '@types/react-dom'],\n  'canvas-antigo': ['@xyflow/react'],\n  'jsdom-antigo': ['jsdom'],\n  'query-antigo': ['@tanstack/react-query', '@tanstack/react-query-devtools'],\n};\nconst grupo = grupos[process.env.VARIANTE] || [];\nfor (const nome of grupo) {\n  const secao = nome in p.dependencies ? 'dependencies' : 'devDependencies';\n  p[secao][nome] = b[secao][nome].replace(/^\\^/, '');\n}\nfs.writeFileSync('/tmp/grupo-retido.json', JSON.stringify(grupo));\nfs.writeFileSync('package.json',\
        \ JSON.stringify(p, null, 2) + '\\n');\nJS\ncase \"${{ matrix.variante }}\" in\n  *-antigo) pnpm install --no-frozen-lockfile ;;\nesac\npnpm list --depth 0 --json > /tmp/deps-depois.json\nnode <<'JS'\nconst fs = require('node:fs');\nconst antes = JSON.parse(fs.readFileSync('/tmp/deps-antes.json', 'utf8'))[0];\nconst depois = JSON.parse(fs.readFileSync('/tmp/deps-depois.json', 'utf8'))[0];\nconst grupo = new Set(JSON.parse(fs.readFileSync('/tmp/grupo-retido.json', 'utf8')));\nfor (const secao of ['dependencies', 'devDependencies']) {\n  for (const [nome, dep] of Object.entries(antes[secao] || {})) {\n    if (!grupo.has(nome) && dep.version !== depois[secao][nome].version)\n      throw new Error(`Dependencia fora do grupo mudou: ${nome} ${dep.version} -> ${depois[secao][nome].version}`);\n  }\n}\nJS\nmkdir -p audit-deps\ncp package.json pnpm-lock.yaml /tmp/deps-antes.json /tmp/deps-depois.json /tmp/grupo-retido.json audit-deps/\n"
    - uses: actions/upload-artifact@v7
      with:
        name: audit-pr4-checks-${{ matrix.variante }}
        path: audit-deps/
        retention-days: 7
    - name: Typecheck
      run: pnpm typecheck
    - name: Lint
      run: pnpm lint
    - name: Unitários completos no checkout original
      run: pnpm test:unit
